<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- tailwind+daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google-fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <title>Payoo | login</title>
    <link rel="shortcut icon" href="./pictures/logo.png">
    <!-- icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style> -->
    <style>
      *{
        font-family: "Outfit",sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[200px] mx-auto pt-32">
      <img src="./pictures/Logo-full.png" alt="">
    </div>
    <div class="form pt-10">
       <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Mobile Number</label>
            <input id="input-number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200" value="01234567890" placeholder="Enter your 11 digit number" />
            <br>
            <label class="label text-neutral font-bold">4 Digit PIN</label>
            <input id="input-pin" type="password" maxlength="4" minlength="4" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit PIN" />
            
            <button id="login-btn" class="btn btn-primary rounded-full">Login</button>
          </fieldset>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
